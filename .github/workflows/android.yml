name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify web-search server
        run: node --test server/test/*.test.mjs

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-daemon --console=plain

      - name: Run JVM unit tests
        run: gradle testDebugUnitTest --stacktrace --no-daemon --console=plain

      - name: Run Android restart instrumentation test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          disable-animations: true
          emulator-boot-timeout: 600
          script: timeout 300s gradle connectedDebugAndroidTest --stacktrace --no-daemon --console=plain

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vynnra-agent-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
